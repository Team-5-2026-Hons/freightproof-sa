# fly.toml app configuration file generated for freightproof-api on 2026-10-26T15:36:54+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'freightproof-api'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'uvicorn app.main:app --host 0.0.0.0 --port 8000'
  beat = 'celery -A app.tasks beat --loglevel=info --schedule=/tmp/freightproof-celerybeat'
  worker = 'celery -A app.tasks worker --loglevel=info'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
