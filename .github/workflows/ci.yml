# CI pipeline for FreightProof SA.
# Runs on every PR targeting dev or main, and on direct pushes to dev.
# Backend and frontend jobs run in parallel — neither blocks the other.

name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

jobs:

  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest

    # Throwaway Postgres for the DB-backed suite (133 of 320 tests). Isolated per
    # workflow run, which matters: tests/conftest.py runs Base.metadata.drop_all()
    # at session teardown, so a shared database would have concurrent PRs dropping
    # each other's tables mid-run. Mirrors infrastructure/docker/docker-compose.test.yml.
    services:
      test-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: freightproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freightproof_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint — ruff
        working-directory: backend
        run: ruff check .

      - name: Type-check — mypy
        working-directory: backend
        run: mypy .

      - name: Test — pytest (excluding slow tests)
        working-directory: backend
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Port 5432, not the 5433 used by docker-compose.test.yml: that mapping
          # exists only to dodge a host Postgres locally. Service containers get a
          # clean runner, so the default port is free.
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/freightproof_test
        run: pytest -m "not slow"

  frontend:
    name: Frontend — lint, type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/dispatcher/package-lock.json

      - name: Install dependencies
        working-directory: frontend/dispatcher
        run: npm ci

      - name: Lint — ESLint via next lint
        working-directory: frontend/dispatcher
        run: npm run lint

      - name: Type-check — tsc
        working-directory: frontend/dispatcher
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # Driver PWA — previously had no CI at all, while carrying 61 source files.
  # The scripts already existed; only this job was missing. Runs vitest too,
  # which the dispatcher job still does not.
  # ---------------------------------------------------------------------------
  driver-pwa:
    name: Driver PWA — lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/driver-pwa/package-lock.json

      - name: Install dependencies
        working-directory: frontend/driver-pwa
        run: npm ci

      - name: Lint — ESLint
        working-directory: frontend/driver-pwa
        run: npm run lint

      - name: Type-check — tsc
        working-directory: frontend/driver-pwa
        run: npx tsc --noEmit

      - name: Test — vitest
        working-directory: frontend/driver-pwa
        run: npm test
