[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# slow: tests that take tens of seconds. CI excludes them from the main pytest step
# (-m "not slow") and runs tests/baseline/test_b7_import_cycles.py in its own step.
markers =
    slow: slow tests, excluded from the default CI run (select with -m slow)
