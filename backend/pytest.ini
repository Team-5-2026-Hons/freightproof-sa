[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Local runs match CI's main step: slow tests are skipped unless asked for. A later -m on the
# command line wins, so `pytest -m slow tests/baseline/test_b7_import_cycles.py` (CI's B7 step)
# still selects them.
addopts = -m "not slow"
# A hung test (a lock wait, an un-awaited future) fails with its name after this many seconds
# instead of stalling the whole run. Generous on purpose: B7's shared fixture runs every cold
# import in one test's setup.
timeout = 300
# slow: tests that take tens of seconds. CI excludes them from the main pytest step
# (-m "not slow") and runs tests/baseline/test_b7_import_cycles.py in its own step.
markers =
    slow: slow tests, excluded from the default CI run (select with -m slow)
    real_pdf: keep real WeasyPrint rendering where the fake_pdf_renderer fixture is in use
